workflow:
  id: art
  facilitator: '@release-train-engineer'
  steps:
  - id: derive-feature
    kind: delegate
    delegates_to: feature-derivation
    actor: '@release-train-engineer'
    conditions: []
  - id: refine-feature
    kind: delegate
    delegates_to: feature-backlog-refinement
    actor: '@release-train-engineer'
    conditions:
    - id: after_derive_feature
      kind: precondition
      type: after
      step_id: derive-feature
  - id: feature-gate
    kind: gate
    actor: '@release-train-engineer'
    conditions:
    - id: after_refine_feature
      kind: precondition
      type: after
      step_id: refine-feature
  - id: extend-runway
    kind: delegate
    delegates_to: architectural-runway-extension
    actor: '@release-train-engineer'
    conditions:
    - id: after_feature_gate
      kind: precondition
      type: after
      step_id: feature-gate
  - id: architecture-gate
    kind: gate
    actor: central-supervisor (Enterprise-Architect hat)
    conditions:
    - id: after_extend_runway
      kind: precondition
      type: after
      step_id: extend-runway
  - id: plan-pi
    kind: delegate
    delegates_to: pi-planning
    actor: '@release-train-engineer'
    conditions:
    - id: after_architecture_gate
      kind: precondition
      type: after
      step_id: architecture-gate
  - id: start-implementing
    kind: direct
    actor: '@release-train-engineer'
    conditions:
    - id: after_plan_pi
      kind: precondition
      type: after
      step_id: plan-pi
  - id: pr-gate
    kind: gate
    actor: central-supervisor (Business-Owner hat)
    conditions:
    - id: after_start_implementing
      kind: precondition
      type: after
      step_id: start-implementing
  - id: demo
    kind: delegate
    delegates_to: system-demo
    actor: '@release-train-engineer'
    conditions:
    - id: after_pr_gate
      kind: precondition
      type: after
      step_id: pr-gate
  - id: demo-gate
    kind: gate
    actor: central-supervisor (Business-Owner hat)
    conditions:
    - id: after_demo
      kind: precondition
      type: after
      step_id: demo
