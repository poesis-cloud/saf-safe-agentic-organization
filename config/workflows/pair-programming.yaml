workflow:
  id: pair-programming
  kind: practice
  parent: scrum
  facilitator: '@scrum-master'
  steps:
  - id: drive
    kind: author
    actor: '@developer'
    output: code-change
    conditions: []
  - id: critique
    kind: challenge
    actor: '@developer'
    output: feasibility-review
    conditions:
    - id: after_drive
      kind: precondition
      type: after
      step_id: drive
  - id: critique-security
    kind: challenge
    actor: '@security-expert'
    output: security-review
    conditions:
    - id: after_drive
      kind: precondition
      type: after
      step_id: drive
