workflow:
  id: lpm
  facilitator: '@value-management-officier'
  steps:
  - id: capture-epic
    kind: delegate
    delegates_to: epic-lean-business-case
    actor: '@value-management-officier'
    conditions: []
  - id: shape-epic
    kind: delegate
    delegates_to: epic-lean-business-case
    actor: '@value-management-officier'
    conditions:
    - id: after_capture_epic
      kind: precondition
      type: after
      step_id: capture-epic
  - id: architect-epic
    kind: delegate
    delegates_to: architectural-vision
    actor: '@value-management-officier'
    conditions:
    - id: after_shape_epic
      kind: precondition
      type: after
      step_id: shape-epic
  - id: epic-gate
    kind: gate
    actor: central-supervisor (Business-Owner hat)
    conditions:
    - id: after_architect_epic
      kind: precondition
      type: after
      step_id: architect-epic
  - id: start-implementing
    kind: direct
    actor: '@value-management-officier'
    conditions:
    - id: after_epic_gate
      kind: precondition
      type: after
      step_id: epic-gate
  - id: epic-outcome-gate
    kind: gate
    actor: central-supervisor (Business-Owner hat)
    conditions:
    - id: after_start_implementing
      kind: precondition
      type: after
      step_id: start-implementing
