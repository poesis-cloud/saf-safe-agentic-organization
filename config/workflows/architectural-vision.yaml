workflow:
  id: architectural-vision
  kind: practice
  parent: lpm
  facilitator: '@value-management-officier'
  steps:
  - id: ea-draft
    kind: author
    actor: '@enterprise-architect'
    output: architecture-vision
    conditions: []
  - id: challenge-security-nfr
    kind: challenge
    actor: '@security-expert'
    output: security-review
    conditions:
    - id: after_ea_draft
      kind: precondition
      type: after
      step_id: ea-draft
  - id: challenge-operability
    kind: challenge
    actor: '@operator'
    output: operability-review
    conditions:
    - id: after_ea_draft
      kind: precondition
      type: after
      step_id: ea-draft
  - id: owner-rewrite
    kind: author
    actor: '@enterprise-architect'
    output: architecture-vision
    conditions:
    - id: after_challenge_security_nfr
      kind: precondition
      type: after
      step_id: challenge-security-nfr
    - id: after_challenge_operability
      kind: precondition
      type: after
      step_id: challenge-operability
  - id: render
    kind: render
    actor: '@enterprise-architect'
    output: architecture-vision
    conditions:
    - id: after_owner_rewrite
      kind: precondition
      type: after
      step_id: owner-rewrite
