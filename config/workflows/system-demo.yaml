workflow:
  id: system-demo
  kind: ceremony
  parent: art
  facilitator: '@release-train-engineer'
  steps:
  - id: demo
    kind: verify
    actor: '@quality-engineer'
    output: qa-signoff
    conditions: []
  - id: verify-security
    kind: verify
    actor: '@security-expert'
    output: security-review
  - id: verify-operability
    kind: verify
    actor: '@operator'
    output: operability-review
  - id: demo-gate
    kind: gate
    actor: central-supervisor
    conditions:
    - id: after_demo
      kind: precondition
      type: after
      step_id: demo
    - id: after_verify_security
      kind: precondition
      type: after
      step_id: verify-security
    - id: after_verify_operability
      kind: precondition
      type: after
      step_id: verify-operability
