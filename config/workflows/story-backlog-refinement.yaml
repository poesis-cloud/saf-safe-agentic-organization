workflow:
  id: story-backlog-refinement
  kind: ceremony
  parent: scrum
  facilitator: '@scrum-master'
  steps:
  - id: draft
    kind: author
    actor: '@product-owner'
    output: story
    conditions: []
    instructions:
    - instructions/discovery-open-items-recorded-or-explicitly-none.instructions.md
  - id: challenge-split
    kind: challenge
    actor: '@developer'
    output: feasibility-review
    conditions:
    - id: after_draft
      kind: precondition
      type: after
      step_id: draft
  - id: challenge-ux
    kind: challenge
    actor: '@ux-designer'
    output: ux-review
    conditions:
    - id: after_draft
      kind: precondition
      type: after
      step_id: draft
  - id: challenge-architecture
    kind: challenge
    actor: '@system-architect'
    output: architecture-review
    conditions:
    - id: after_draft
      kind: precondition
      type: after
      step_id: draft
  - id: owner-rewrite
    kind: author
    actor: '@product-owner'
    output: story
    conditions:
    - id: after_challenge_split
      kind: precondition
      type: after
      step_id: challenge-split
    - id: after_challenge_ux
      kind: precondition
      type: after
      step_id: challenge-ux
    - id: after_challenge_architecture
      kind: precondition
      type: after
      step_id: challenge-architecture
