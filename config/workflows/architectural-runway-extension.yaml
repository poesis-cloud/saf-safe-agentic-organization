workflow:
  id: architectural-runway-extension
  kind: practice
  parent: art
  facilitator: '@release-train-engineer'
  steps:
  - id: inventory
    kind: author
    actor: '@system-architect'
    output: adr
    conditions: []
  - id: challenge-security
    kind: challenge
    actor: '@security-expert'
    output: security-review
    conditions:
    - id: after_inventory
      kind: precondition
      type: after
      step_id: inventory
  - id: challenge-operability
    kind: challenge
    actor: '@operator'
    output: operability-review
    conditions:
    - id: after_inventory
      kind: precondition
      type: after
      step_id: inventory
  - id: challenge-feasibility
    kind: challenge
    actor: '@developer'
    output: feasibility-review
    conditions:
    - id: after_inventory
      kind: precondition
      type: after
      step_id: inventory
  - id: owner-rewrite
    kind: author
    actor: '@system-architect'
    output: architecture-runway
    conditions:
    - id: after_challenge_security
      kind: precondition
      type: after
      step_id: challenge-security
    - id: after_challenge_operability
      kind: precondition
      type: after
      step_id: challenge-operability
    - id: after_challenge_feasibility
      kind: precondition
      type: after
      step_id: challenge-feasibility
  - id: stage-gate
    kind: gate
    actor: '@release-train-engineer'
    conditions:
    - id: after_owner_rewrite
      kind: precondition
      type: after
      step_id: owner-rewrite
