workflow:
  id: scrum
  facilitator: '@scrum-master'
  steps:
  - id: plan-iteration
    kind: delegate
    delegates_to: iteration-planning
    actor: '@scrum-master'
    conditions: []
  - id: groom-story
    kind: delegate
    delegates_to: story-backlog-refinement
    actor: '@scrum-master'
    conditions:
    - id: after_plan_iteration
      kind: precondition
      type: after
      step_id: plan-iteration
  - id: story-gate
    kind: gate
    actor: '@scrum-master'
    conditions:
    - id: after_groom_story
      kind: precondition
      type: after
      step_id: groom-story
  - id: execute-story
    kind: delegate
    delegates_to: pair-programming
    actor: '@scrum-master'
    conditions:
    - id: after_story_gate
      kind: precondition
      type: after
      step_id: story-gate
  - id: accept-to-qa
    kind: direct
    actor: '@scrum-master'
    conditions:
    - id: after_execute_story
      kind: precondition
      type: after
      step_id: execute-story
  - id: verify-story
    kind: delegate
    delegates_to: verification
    actor: '@scrum-master'
    conditions:
    - id: after_accept_to_qa
      kind: precondition
      type: after
      step_id: accept-to-qa
  - id: pr-gate
    kind: gate
    actor: central-supervisor (Business-Owner hat)
    conditions:
    - id: after_verify_story
      kind: precondition
      type: after
      step_id: verify-story
