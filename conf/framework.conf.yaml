# ============================================================
# Framework layout — where THIS framework (the application embedding the harness)
# keeps the files the harness loads agnostically. Paths are relative to the
# framework root; '.' means the root itself (this framework colocates its skills
# there). The workspace (= this framework's portfolio) is a separate plane,
# described by conf/workspace.conf.yaml. Validated against
# harness/contracts/conf/framework.conf.schema.json at harness initialization.
# ============================================================

paths:
  skills: skills
  agents: agents
  instructions: instructions
  prompts: prompts
  templates: templates
  schemas: schemas
