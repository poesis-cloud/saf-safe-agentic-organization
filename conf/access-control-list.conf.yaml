# Role-based access control for the Poesis SAFe agentic framework.
#
# Model:
#   - Actor: an agent file (e.g. business-owner.agent.md).
#   - Role: a named set of Privileges assigned to one or more Actors.
#   - Privilege: exactly one Artifact plus exactly one Action verb.
#   - Action: CREATE | READ | UPDATE | DELETE.
#
# Read policy:
#   - Every Actor is assigned the shared "workspace-reader" role, granting READ
#     on every Artifact.
#   - Each owner role also carries READ on its owned Artifacts so authorization
#     succeeds even if evaluated against that role alone.
#   - Mutate privileges (CREATE/UPDATE/DELETE) are listed per owner role and
#     reflect the artifact owners currently registered in this ACL.

actors:
  - id: value-management-officier.agent.md
    roles:
      - value-management-officier
      - workspace-reader
  - id: business-owner.agent.md
    roles:
      - business-owner
      - workspace-reader
  - id: enterprise-architect.agent.md
    roles:
      - enterprise-architect
      - workspace-reader
  - id: release-train-engineer.agent.md
    roles:
      - release-train-engineer
      - workspace-reader
  - id: product-manager.agent.md
    roles:
      - product-manager
      - workspace-reader
