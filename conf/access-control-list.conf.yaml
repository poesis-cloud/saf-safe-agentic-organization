    roles:
      - system-architect
      - workspace-reader
  - id: scrum-master.agent.md
    roles:
      - scrum-master
      - workspace-reader
  - id: product-owner.agent.md
    roles:
      - product-owner
      - workspace-reader
  - id: developer.agent.md
    roles:
      - developer
      - workspace-reader
  - id: operator.agent.md
    roles:
      - operator
      - workspace-reader
  - id: security-expert.agent.md
    roles:
      - security-expert
      - workspace-reader
  - id: ux-designer.agent.md
    roles:
      - ux-designer
      - workspace-reader
  - id: quality-engineer.agent.md
    roles:
      - quality-engineer
      - workspace-reader
  - id: tech-writer.agent.md
    roles:
      - workspace-reader

