# ============================================================
# Host-agnostic model profile catalog — canonical model identity, independent of any host.
# ============================================================
# `slug` here is the CANONICAL model slug. It is NOT a valid `runSubagent` model argument by itself —
# no host understands these slugs directly. Each host adapter maps a canonical `slug` to that host's
# own model identifier via its own `harness/adapters/<env>/models.yaml` (see
# `harness/adapters/github-copilot/models.yaml` for the GitHub Copilot binding).
#
# This file only carries identity + capability metadata (what the model IS), never routing policy
# (tiers, role-default floors, scoring, config profiles) — that policy stays in
# `conf/llm-routing.conf.yaml` and is expressed in terms of these canonical slugs.
#
# Fields:
#   slug               — internal canonical model slug (stable across hosts; hosts resolve it via
#                        their own adapters/<env>/models.yaml). Reuses the GitHub Copilot catalog
#                        model `id` as the slug verbatim where available (see harness/adapters/github-copilot/models.yaml)
#                        so cross-referencing against that host's models.json stays trivial.
#   costRank           — relative cost, 1 (cheapest) .. 10 (most expensive). MECHANICALLY derived
#                        from each model's blended token price (0.25*input + 0.75*output, USD per
#                        1M tokens, from this host's models.json billing.token_prices), percentile-
#                        ranked across the 20-model catalog. High confidence, reproducible.
#                        model's position on the Artificial Analysis Intelligence Index v4.1
#                        leaderboard (artificialanalysis.ai, snapshot 2026-07-04) where the model is
#                        directly observed there; otherwise interpolated from its family/generation
#                        position relative to observed siblings (flagged per-model below).
#   description        — human-readable summary, 120 characters max
#   capabilities       — relative 0..10 judgments per capability tag. Tags map to distinct
#                        Artificial Analysis evaluation categories (chosen because each one's
#                        leaderboard order was independently verified to diverge from the others —
#                        see "capability tag rationale" below); NOT vibes-based restatements of a
#                        single underlying "how good is this model" judgment.
#
# Capability tag rationale (revised 2026-07-04; supersedes the original 8-tag list):
#   deep-reasoning        — AA "Reasoning & knowledge" / GPQA Diamond / Humanity's Last Exam.
#   coding                — AA "Coding" index + AA Coding Agent Index (SWE-bench-style, pass@1).
#                           Renamed from `code-specialized`: this harness dispatches agentic
#                           coding (edit/build/test loops), which AA ranks separately from raw
#                           "Coding" — the coding-agent numbers are what's cited here.
#   tool-use              — AA "Agentic tool use" eval. Kept SEPARATE from agentic-coding because
#                           their leaderboard orders diverge (e.g. GPT-5.5 leads tool-use but not
#                           coding; Claude Fable 5 leads coding but not tool-use) — proof this is an
#                           independent axis, not a duplicate of code-specialized.
#   long-context          — AA-LCR ("long context reasoning") eval, not just raw context-window
#                           size (that's a hard limit already visible in the host's models.json).
#   multimodal            — AA "Visual reasoning" eval. Diverges sharply from every other axis
#                           (Gemini 3.x dominates here despite not leading overall intelligence).
#   writing-quality       — AA GDPval-AA v2 + AA-Briefcase (real-world deliverables: memos, decks,
#                           analysis). REPLACES the old `creative` + `editorial` pair: those two
#                           tags never actually diverged in practice and had no benchmark backing;
#                           this SAFe/ITIP harness dispatches PRDs/ADRs/reviews, not fiction, so a
#                           real-world-deliverable-quality proxy is more pertinent than "creative."
#   instruction-following — AA "Instruction following" eval. ADDED: its leaderboard order is
#                           essentially uncorrelated with the Intelligence Index (the top reasoning
#                           models are NOT the top instruction-followers) — a genuinely independent,
#                           previously-missing signal that matters for agent-dispatch reliability.
#   fast-iteration        — AA "Output Speed" (tokens/sec), not merely 1/costRank (a fast model
#                           can still be expensive per token, e.g. claude-opus-4.8-fast).
#   schema-adherence      — ADDED (Replaces structured-output): SAFe orchestration relies entirely on
#                           complex YAML/JSON artifact contracts. While `models.json` claims uniform
#                           support, real-world reliability in generating deep nested schemas without
#                           hallucinating keys or breaking syntax has a massive observed gradient.
#                           This score (0..10) is essential to separate Tier-1 reasoning models from
#                           smaller models that fail on SAFe artifact layouts.
#
# Catalog snapshot: every `model_picker_enabled: true` chat model from the GitHub Copilot
# models.json catalog as of 2026-07-04 (20 models). Disabled/legacy/embedding entries in that
# catalog (old GPT-4 family, text-embedding-*, disabled MAI-Code-1-Flash duplicates,
# trajectory-compaction) are intentionally excluded — they are not selectable dispatch targets.
#
# CONFIDENCE CAVEAT: Artificial Analysis publishes only its top-N models per chart; not every
# catalog model surfaced in every list fetched here. Where a model is not directly observed in a
# given AA ranking, its scores are interpolated from its family/generation position relative to
# siblings that WERE observed (e.g. `claude-opus-4.6` sits below the directly-observed
# `claude-opus-4.7`). This is lower-confidence than a directly observed rank and should be
# refreshed against artificialanalysis.ai per-model pages if this file starts driving real routing.
# ============================================================

