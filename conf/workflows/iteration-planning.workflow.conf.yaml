workflow:
  id: iteration-planning
  kind: ceremony
  parent: scrum
  facilitator: '@scrum-master'
  steps:
  - id: author-stories
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    kind: author
    actor: '@product-owner'
    output: story
    conditions: []
  - id: challenge-sizing
    capabilities:
      deep-reasoning: 8
      coding: 8
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    kind: challenge
    actor: '@developer'
    output: feasibility-review
    conditions:
    - id: after_author_stories
      kind: precondition
      type: after
      step_id: author-stories
  - id: challenge-flag
    capabilities:
      deep-reasoning: 9
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    kind: challenge
    actor: '@system-architect'
    output: architecture-review
    conditions:
    - id: after_author_stories
      kind: precondition
      type: after
      step_id: author-stories
  - id: challenge-security
    capabilities:
      deep-reasoning: 9
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    kind: challenge
    actor: '@security-expert'
    output: security-review
    conditions:
    - id: after_author_stories
      kind: precondition
      type: after
      step_id: author-stories
  - id: challenge-ux
    capabilities:
      deep-reasoning: 8
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    kind: challenge
    actor: '@ux-designer'
    output: ux-review
    conditions:
    - id: after_author_stories
      kind: precondition
      type: after
      step_id: author-stories
  - id: plan-and-gate
    capabilities:
      deep-reasoning: 0
      coding: 0
      tool-use: 0
      long-context: 0
      multimodal: 0
      writing-quality: 0
      instruction-following: 0
      fast-iteration: 0
      schema-adherence: 0
    kind: gate
    actor: '@scrum-master'
    conditions:
    - id: after_challenge_sizing
      kind: precondition
      type: after
      step_id: challenge-sizing
    - id: after_challenge_flag
      kind: precondition
      type: after
      step_id: challenge-flag
    - id: after_challenge_security
      kind: precondition
      type: after
      step_id: challenge-security
    - id: after_challenge_ux
      kind: precondition
      type: after
      step_id: challenge-ux
