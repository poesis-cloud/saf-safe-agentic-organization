workflow:
  id: pi-planning
  kind: ceremony
  after: [architectural-runway-extension]
  facilitator: '@release-train-engineer'
  steps:
  - id: confirm-intent
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: '@product-manager'
    artifacts: [feature]
    conditions: []
  - id: confirm-runway
    capabilities:
      deep-reasoning: 9
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: '@system-architect'
    artifacts: [architecture-runway]
  - id: challenge-feasibility
    capabilities:
      deep-reasoning: 8
      coding: 8
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    actor: '@developer'
    artifacts: [feasibility-review]
    conditions:
    - id: after_confirm_intent
      kind: precondition
      type: after
      step_id: confirm-intent
    - id: after_confirm_runway
      kind: precondition
      type: after
      step_id: confirm-runway
  - id: challenge-nfr-security
    capabilities:
      deep-reasoning: 9
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    actor: '@security-expert'
    artifacts: [security-review]
    conditions:
    - id: after_confirm_intent
      kind: precondition
      type: after
      step_id: confirm-intent
    - id: after_confirm_runway
      kind: precondition
      type: after
      step_id: confirm-runway
  - id: challenge-nfr-operability
    capabilities:
      deep-reasoning: 8
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    actor: '@operator'
    artifacts: [operability-review]
    conditions:
    - id: after_confirm_intent
      kind: precondition
      type: after
      step_id: confirm-intent
    - id: after_confirm_runway
      kind: precondition
      type: after
      step_id: confirm-runway
  - id: challenge-ux
    capabilities:
      deep-reasoning: 8
      coding: 2
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    actor: '@ux-designer'
    artifacts: [ux-review]
    conditions:
    - id: after_confirm_intent
      kind: precondition
      type: after
      step_id: confirm-intent
    - id: after_confirm_runway
      kind: precondition
      type: after
      step_id: confirm-runway
  - id: commit
    capabilities:
      deep-reasoning: 2
      coding: 3
      tool-use: 8
      long-context: 2
      multimodal: 0
      writing-quality: 1
      instruction-following: 9
      fast-iteration: 8
      schema-adherence: 8
    actor: '@release-train-engineer'
    artifacts: [program-kanban]
    conditions:
    - id: after_challenge_feasibility
      kind: precondition
      type: after
      step_id: challenge-feasibility
    - id: after_challenge_nfr_security
      kind: precondition
      type: after
      step_id: challenge-nfr-security
    - id: after_challenge_nfr_operability
      kind: precondition
      type: after
      step_id: challenge-nfr-operability
    - id: after_challenge_ux
      kind: precondition
      type: after
      step_id: challenge-ux
