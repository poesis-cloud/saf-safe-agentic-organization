      kind: precondition
      type: after
      step_id: challenge-security-nfr
    - id: after_challenge_operability
      kind: precondition
      type: after
      step_id: challenge-operability
  - id: render
    capabilities:
      deep-reasoning: 2
      coding: 3
      tool-use: 5
      long-context: 3
      multimodal: 0
      writing-quality: 4
      instruction-following: 8
