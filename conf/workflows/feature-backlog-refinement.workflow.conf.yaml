      deep-reasoning: 9
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: '@system-architect'
    artifacts: [feature-enabler]
    conditions:
    - id: after_challenge_feasibility
      kind: precondition
      type: after
      step_id: challenge-feasibility
    - id: after_challenge_architecture
      kind: precondition
      type: after
      step_id: challenge-architecture
    - id: after_challenge_security
      kind: precondition
      type: after
      step_id: challenge-security
    - id: after_challenge_ux
      kind: precondition
