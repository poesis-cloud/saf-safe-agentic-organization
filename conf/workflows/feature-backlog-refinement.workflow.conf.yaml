    - id: after_draft_business
      kind: precondition
      type: after
      step_id: draft-business
    - id: after_draft_enabler
      kind: precondition
      type: after
      step_id: draft-enabler
  - id: challenge-ux
    capabilities:
      deep-reasoning: 8
      coding: 2
