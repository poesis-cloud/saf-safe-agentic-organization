workflow:
  id: feature-backlog-refinement
  kind: ceremony
  after: [feature-derivation]
  facilitator: '@release-train-engineer'
  steps:
  - id: draft-business
    capabilities:
      deep-reasoning: 7
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: '@product-manager'
    artifacts: [feature]
    conditions: []
  - id: draft-enabler
    capabilities:
      deep-reasoning: 9
      coding: 0
      tool-use: 4
      long-context: 6
      multimodal: 0
      writing-quality: 8
      instruction-following: 8
      fast-iteration: 2
      schema-adherence: 8
    actor: '@system-architect'
    artifacts: [feature-enabler]
  - id: challenge-feasibility
    capabilities:
      deep-reasoning: 8
      coding: 8
      tool-use: 3
      long-context: 6
      multimodal: 0
      writing-quality: 6
      instruction-following: 8
      fast-iteration: 3
      schema-adherence: 6
    actor: '@developer'
    artifacts: [feasibility-review]
    conditions:
    - id: after_draft_business
      kind: precondition
      type: after
      step_id: draft-business
    - id: after_draft_enabler
      kind: precondition
      type: after
      step_id: draft-enabler
  - id: challenge-architecture
