      capabilities:
        deep-reasoning: 7
        coding: 0
        tool-use: 4
        long-context: 6
        multimodal: 0
        writing-quality: 8
        instruction-following: 8
        fast-iteration: 2
        schema-adherence: 8
      actor: "@release-train-engineer"
      instructions:
        - instructions/program-inspect-and-adapt-metrics-review.instructions.md
    - id: retrospective
      capabilities:
        deep-reasoning: 7
        coding: 0
        tool-use: 4
        long-context: 6
        multimodal: 0
        writing-quality: 8
        instruction-following: 8
        fast-iteration: 2
        schema-adherence: 8
