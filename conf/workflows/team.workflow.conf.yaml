workflow:
  id: scrum
  facilitator: '@scrum-master'
  steps:
  - id: plan-iteration
    capabilities:
      deep-reasoning: 5
      coding: 0
      tool-use: 7
      long-context: 5
      multimodal: 0
      writing-quality: 3
      instruction-following: 8
      fast-iteration: 5
      schema-adherence: 7
    kind: delegate
    delegates_to: iteration-planning
    actor: '@scrum-master'
    conditions: []
  - id: groom-story
    capabilities:
      deep-reasoning: 5
      coding: 0
      tool-use: 7
      long-context: 5
      multimodal: 0
      writing-quality: 3
      instruction-following: 8
      fast-iteration: 5
      schema-adherence: 7
    kind: delegate
    delegates_to: story-backlog-refinement
    actor: '@scrum-master'
    conditions:
    - id: after_plan_iteration
      kind: precondition
      type: after
      step_id: plan-iteration
  - id: story-gate
    capabilities:
      deep-reasoning: 0
      coding: 0
      tool-use: 0
      long-context: 0
      multimodal: 0
      writing-quality: 0
      instruction-following: 0
      fast-iteration: 0
      schema-adherence: 0
